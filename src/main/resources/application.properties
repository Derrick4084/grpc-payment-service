# ===============================
# Application
# ===============================
spring.application.name=grpc-payment-svc

# ===============================
# AWS Secrets Manager (Postgres)
# ===============================
spring.config.import=aws-secretsmanager:${POSTGRES_DB_SECRET_NAME}

# ===============================
# gRPC server
# ===============================

spring.grpc.server.port=9090
spring.grpc.server.enable-reflection=true

# ===============================
# gRPC Clients
# ===============================
grpc.client.customer.address=${CUSTOMER_SERVICE_ADDR:grpc-customer-svc}:${GRPC_PORT}
grpc.client.customer.negotiationType=plaintext

# ===============================
# PostgreSQL Datasource
# ===============================
spring.datasource.url=jdbc:postgresql://${host}/payments?sslmode=verify-full&sslrootcert=/app/certs/rds-combined-ca-bundle.pem
spring.datasource.username=${username}
spring.datasource.password=${password}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA
# ===============================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database=postgresql
spring.jpa.show-sql=true

# ===============================
# Flyway
# ===============================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-description=init
spring.flyway.baseline-version=0
spring.flyway.user=${username}
spring.flyway.password=${password}

# ===============================
# Kafka (MSK IAM Auth)
# ===============================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}


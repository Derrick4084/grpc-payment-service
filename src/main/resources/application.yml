spring:
  application:
    name: grpc-payment-service
  config:
    import: aws-secretsmanager:${POSTGRES_DB_SECRET_ARN}?prefix=postgres.
  grpc:
    client:
      customer:
        host: ${CUSTOMER_SERVICE_ADDR}
        port: {GRPC_PORT}
    server:
      port: 9090
      enable-reflection: true
    #    security:
    #      enabled: true
    #      certificateChain: file:certificates/server
    #      privateKey: file:certificates/server
  datasource:
    url: jdbc:postgresql://${postgres.host}/microservicesdb?sslmode=verify-full&sslrootcert=/app/certs/rds-combined-ca-bundle.pem
    username: ${postgres.username}
    password: ${postgres.password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    database: postgresql
#    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
  flyway:
    baseline-on-migrate: true
    enabled: true
    baseline-description: "init"
    baseline-version: 0
    user: ${postgres.username}
    password: ${postgres.password}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    properties:
      ssl:
        endpoint:
          identification:
            algorithm:
      sasl:
        client:
          callback:
            handler:
              class: software.amazon.msk.auth.iam.IAMClientCallbackHandler
        jas:
          config: software.amazon.msk.auth.iam.IAMLoginModule required;
        mechanism: AWS_MSK_IAM
      security:
        protocol: SASL_SSL


management:
  tracing:
    sampling:
      probability: 1.0
#  zipkin:
#    tracing:
#      endpoint: http://localhost:9411/api/v2/spans